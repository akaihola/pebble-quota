name: Build PBW

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Pebble SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest
          pebble --version

      - name: Build watchface
        working-directory: watchface
        run: make clean build

      - name: Upload PBW
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pebble-quota-pbw
          path: watchface/build/watchface.pbw
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pebble-quota-pbw
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version' watchface/package.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          asset="pebble-quota-emery-$version.pbw"
          mv release/watchface.pbw "release/$asset"
          gh release create "$GITHUB_REF_NAME" "release/$asset" \
            --verify-tag --generate-notes --title "Quota Pace $version"
