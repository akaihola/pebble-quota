name: Build PBW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PEBBLE_PYTHON_VERSION: '3.12.3'
      PEBBLE_NODE_VERSION: '24'
      PEBBLE_TOOL_VERSION: '5.0.40'
      PEBBLE_SDK_VERSION: '4.33.1'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate watchface version
        run: jq -e '.version | test("^[0-9]+\\.[0-9]+\\.0$")' watchface/package.json >/dev/null

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PEBBLE_NODE_VERSION }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PEBBLE_PYTHON_VERSION }}

      - name: Install Pebble CLI
        run: uv tool install --python "$PEBBLE_PYTHON_VERSION" "pebble-tool==$PEBBLE_TOOL_VERSION"

      - name: Cache Pebble SDK
        id: sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-${{ runner.os }}-${{ runner.arch }}-python${{ env.PEBBLE_PYTHON_VERSION }}-node${{ env.PEBBLE_NODE_VERSION }}-tool${{ env.PEBBLE_TOOL_VERSION }}-sdk${{ env.PEBBLE_SDK_VERSION }}

      - name: Install Pebble SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: pebble sdk install "$PEBBLE_SDK_VERSION"

      - name: Verify Pebble SDK
        run: pebble --version

      - name: Build watchface
        working-directory: watchface
        run: make clean build

      - name: Verify PBW metadata
        working-directory: watchface
        run: |
          version=$(jq -er '.version' package.json)
          unzip -t build/watchface.pbw >/dev/null
          unzip -p build/watchface.pbw appinfo.json |
            jq -e --arg version "$version" \
              '.versionLabel == $version and
               .uuid == "55cd5be7-0481-48aa-a20e-2edf1d8b713b" and
               .targetPlatforms == ["emery"]' >/dev/null

      - name: Upload PBW
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pebble-quota-pbw
          path: watchface/build/watchface.pbw
          if-no-files-found: error

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['watchface--release_created'] }}
      tag_name: ${{ steps.release.outputs['watchface--tag_name'] }}
      version: ${{ steps.release.outputs['watchface--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: pebble-quota-pbw
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          version=$(jq -er '.version' watchface/package.json)
          if [[ "$RELEASE_VERSION" != "$version" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "release $RELEASE_TAG ($RELEASE_VERSION) does not match package version $version" >&2
            exit 1
          fi
          asset="pebble-quota-emery-$version.pbw"
          mv release/watchface.pbw "release/$asset"
          gh release upload "$RELEASE_TAG" "release/$asset"
